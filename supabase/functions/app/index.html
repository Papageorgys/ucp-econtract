<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>e-Contract</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>:root{
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#151B26; --ink-2:#4E5968; --ink-3:#8792A2;
  --line:#D9DFE7; --line-2:#EBEFF4; --focus:#2563EB;
  --brand:#0B3D91; --brand-2:#1450C4; --brand-soft:#E8EFFB; --brand-ink:#0B3D91;
  --ok:#0F7A3D; --ok-soft:#E4F4EA; --warn:#8A5A00; --warn-soft:#FFF4DB; --err:#B3261E; --err-soft:#FCE9E7;
  --r:12px; --r-lg:16px; --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1520;--card:#18202C;--ink:#EDF1F6;--ink-2:#B4BDC9;--ink-3:#7B8595;--line:#2A3441;--line-2:#222B37;--focus:#7FA7F2;--brand:#7FA7F2;--brand-2:#5C8EEB;--brand-soft:#1B2A45;--brand-ink:#B8CEF8;--ok:#5FC482;--ok-soft:#14301F;--warn:#E5B54A;--warn-soft:#3A2D10;--err:#F0928A;--err-soft:#3C1A17;--sh:none}}
:root[data-theme="dark"]{--bg:#0F1520;--card:#18202C;--ink:#EDF1F6;--ink-2:#B4BDC9;--ink-3:#7B8595;--line:#2A3441;--line-2:#222B37;--focus:#7FA7F2;--brand:#7FA7F2;--brand-2:#5C8EEB;--brand-soft:#1B2A45;--brand-ink:#B8CEF8;--ok:#5FC482;--ok-soft:#14301F;--warn:#E5B54A;--warn-soft:#3A2D10;--err:#F0928A;--err-soft:#3C1A17;--sh:none}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit} h1,h2,h3{margin:0;line-height:1.2;font-weight:700} p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:14px} .center{text-align:center} .err-text{color:var(--err)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* top bar */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:56px}
.brand{font-weight:800;font-size:17px;color:var(--brand-ink);display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--brand);position:relative}
.brand i::after{content:"";position:absolute;left:9px;top:5px;width:4px;height:12px;background:#fff;border-radius:2px;transform:skewX(-14deg)}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{background:transparent;border:0;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}

/* layout */
.cwrap{max-width:640px;margin:0 auto;padding-bottom:120px}
.cmain{padding:8px 20px 24px}
.h1{font-size:26px;letter-spacing:-.015em;margin:14px 0 6px} .h2{font-size:17px;margin-bottom:10px}
.lead{color:var(--ink-2);margin-bottom:20px;max-width:58ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.card.list{padding:8px 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.center-stack{display:grid;gap:12px;justify-items:stretch;text-align:center}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px} .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* stepper */
.stepper{padding:14px 20px 0}
.stepper ol{list-style:none;margin:0;padding:0;display:flex;gap:0;counter-reset:s}
.stepper li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12px;color:var(--ink-3);text-align:center}
.stepper li::before{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
.stepper li:last-child::before{display:none}
.stepper .dot{width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;z-index:1}
.stepper li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff} .stepper li.done::before{background:var(--ok)}
.stepper li.cur .dot{border-color:var(--brand-2);color:var(--brand-ink);box-shadow:0 0 0 4px var(--brand-soft)} .stepper li.cur{color:var(--ink);font-weight:600}
.stepper .lbl{max-width:80px;line-height:1.2}
.stepof{font-size:13px;color:var(--ink-2);margin:10px 0 0}
@media (max-width:480px){.stepper .lbl{display:none} .stepper li.cur .lbl{display:block;position:absolute;top:32px;white-space:nowrap} .stepper ol{padding-bottom:18px}}

/* fields */
.field{display:grid;gap:6px;margin:0 0 18px}
.field label{font-weight:600;font-size:15px} .field .opt{font-weight:400;color:var(--ink-3);font-size:13px}
.field .why{font-size:13.5px;color:var(--ink-2)}
.field .inwrap{position:relative}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--card);width:100%;font-size:16px;min-height:48px;transition:border-color .12s,box-shadow .12s}
.field input:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.field input:disabled{background:var(--line-2);color:var(--ink-2);border-style:dashed}
.field .hint{font-size:13px;color:var(--ink-3)} .field .err{font-size:13.5px;color:var(--err);font-weight:600;display:flex;gap:6px}
.field .err::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--err);color:#fff;font-size:11px;flex:none;margin-top:3px}
.field.has-err input{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.field .ok-mark{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ok);font-weight:800;opacity:0;transition:opacity .15s}
.field.has-ok .ok-mark{opacity:1} .field.has-ok input{border-color:var(--ok)}

/* choices */
.choices{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,1),1fr)}
.choice{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--card);min-height:56px;transition:border-color .12s,background .12s}
.choice:hover{border-color:var(--brand-2)} .choice.sel{border-color:var(--brand-2);background:var(--brand-soft)} .choice.dis{opacity:.5;cursor:not-allowed}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice .ci{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center} .choice.sel .ci{border-color:var(--brand-2)} .choice.sel .ci::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand-2)}
.choice:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.choice .ct b{display:block} .choice .ct span{font-size:14px;color:var(--ink-2)} .choice .cr{text-align:right;display:grid;justify-items:end} .choice .cr b{font-size:18px;color:var(--brand-ink)}
.choices .err,.consents .err,.card .err#docs-err{font-size:13.5px;color:var(--err);font-weight:600;grid-column:1/-1;margin:0}

/* journey cards */
.jgrid{display:grid;gap:12px}
.jcard{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;cursor:pointer;display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;box-shadow:var(--sh);transition:border-color .12s,transform .08s}
.jcard:hover{border-color:var(--brand-2)} .jcard:active{transform:scale(.995)}
.jcard .ic{grid-row:1/3;width:44px;height:44px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);font-size:20px}
.jcard b{font-size:17px} .jcard span:last-child{color:var(--ink-2);font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;min-height:48px;font-size:16px;transition:background .12s,border-color .12s,transform .06s;position:relative}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.secondary{background:var(--card);border-color:var(--brand);color:var(--brand-ink)} .btn.secondary:hover{background:var(--brand-soft)}
.btn.link{background:transparent;color:var(--ink-2);padding:8px 8px;min-height:40px;font-weight:500} .btn.link:hover{color:var(--ink);text-decoration:underline}
.btn.big{width:100%} .btn.sm{min-height:38px;padding:8px 14px;font-size:14px;border-radius:9px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff} .btn.danger{background:var(--card);border-color:var(--err);color:var(--err)}
.btn .gov{width:22px;height:22px;border-radius:5px;background:#fff;color:var(--brand);font-size:11px;font-weight:800;display:grid;place-items:center}
.btn .spin{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
body.busy .btn.primary .spin{display:inline-block} body.busy .btn.primary{pointer-events:none;opacity:.85}
.btn.busy{opacity:.6;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* sticky CTA */
.cta{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:4;padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.cta .ctain{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.cta .btn.primary{min-width:180px}
@media (max-width:480px){.cta .btn.primary{flex:1}}

/* alerts, tags, pills */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin:8px 0 12px;font-size:15px;border:1px solid transparent}
.alert .ai{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.alert.ok{background:var(--ok-soft)} .alert.ok .ai{background:var(--ok)} .alert.warn{background:var(--warn-soft)} .alert.warn .ai{background:var(--warn)} .alert.err{background:var(--err-soft)} .alert.err .ai{background:var(--err)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);margin-bottom:8px} .tag.ok{background:var(--ok-soft);color:var(--ok)}
.pill{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--warn-soft);color:var(--warn)} .pill.approved{background:var(--ok-soft);color:var(--ok)} .pill.rejected{background:var(--err-soft);color:var(--err)} .pill.none{background:var(--line-2);color:var(--ink-2)}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)} .line:first-of-type{border-top:0} .line .desc{display:block;font-size:14px;color:var(--ink-2)} .line .price{color:var(--brand-ink)}
.offer .row{margin-top:14px} .offer .row .btn{flex:1}

/* documents */
.docrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2)} .docrow:first-child{border-top:0}
.docrow .th{width:44px;height:44px;border-radius:10px;background:var(--line-2);display:grid;place-items:center;font-size:20px}
.docrow .dt b{display:block} .docrow .desc{display:block;font-size:13.5px;color:var(--ink-2)} .docrow .da{display:grid;gap:6px;justify-items:end}
.docrow.rejected .th{background:var(--err-soft)} .docrow.approved .th{background:var(--ok-soft)}
@media (max-width:480px){.docrow{grid-template-columns:44px 1fr} .docrow .da{grid-column:2;justify-items:start;grid-auto-flow:column;align-items:center}}

/* consents, otp, kv, details */
.consents{display:grid;gap:14px} .check{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:15px;cursor:pointer;min-height:24px}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--brand-2)}
.otp{display:flex;gap:8px;justify-content:center;margin:12px 0}
.otp input{width:46px;height:56px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.otp input:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
#otp-err{font-size:13.5px;color:var(--err);font-weight:600;text-align:center;margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 6px;font-size:15px} .kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600}
.kv input{border:0;background:transparent;font-weight:700;width:100%;text-align:right}
details{border-top:1px solid var(--line-2);padding:12px 0} details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}
details summary::after{content:"+";color:var(--ink-3);font-size:20px} details[open] summary::after{content:"–"} details .body{padding-top:8px;font-size:14.5px;color:var(--ink-2)}

/* hero / done */
.hero{background:var(--brand);color:#fff;border-radius:var(--r-lg);padding:26px 22px;margin:14px 0} .hero h1{color:#fff;font-size:24px} .hero p{color:rgba(255,255,255,.85);margin-top:6px}
.ref{font-size:14px;color:var(--ink-2);margin-bottom:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px} .steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.steps li i{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.steps li b{display:block} .steps li span{color:var(--ink-2);font-size:14.5px}

/* skeleton, toast, live, sheet, lightbox, demo */
.sk{height:16px;border-radius:6px;background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0} .sk:first-child{width:60%} @keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)} .toast.err{background:var(--err);color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:20} .sheet-bg.open{display:flex}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:22px 20px 30px} .sheet h2{margin-bottom:6px} .sheet .kv{margin:14px 0}
.lightbox{position:fixed;inset:0;background:rgba(10,15,25,.85);display:none;place-items:center;z-index:30;padding:20px;cursor:zoom-out} .lightbox.open{display:grid} .lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.demo{padding:8px 20px 30px;font-size:12.5px;color:var(--ink-3)} .demo .ctl{display:none;margin-top:8px;gap:8px;flex-wrap:wrap} .demo.on .ctl{display:flex}
.demo .ctl button{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:transparent;color:var(--ink-2);cursor:pointer;font-size:12.5px}

/* agent console */
.awrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}
@media (max-width:900px){.awrap{grid-template-columns:1fr}}
.queue{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;align-self:start}
.queue h2{padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between}
.queue .q{list-style:none;margin:0;padding:0} .queue .q li{padding:12px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;display:grid;gap:3px}
.queue .q li:hover{background:var(--line-2)} .queue .q li.sel{background:var(--brand-soft)} .queue .q li b{font-size:14.5px} .queue .q li .m{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.queue .empty{padding:20px 16px;color:var(--ink-3);font-size:14px}
.rec{display:grid;gap:14px}
.rhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap} .rhead h1{font-size:20px} .rhead .sub{color:var(--ink-2);font-size:14px;margin-top:2px} .rhead .sp{flex:1}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 20px;font-size:14px} .kvgrid div span{display:block;color:var(--ink-3);font-size:12.5px} .kvgrid div b{font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column} .dcard.approved{border-color:var(--ok)} .dcard.rejected{border-color:var(--err)}
.dcard .prev{height:190px;background:var(--line-2);display:grid;place-items:center;color:var(--ink-3);cursor:zoom-in} .dcard .prev img{width:100%;height:100%;object-fit:cover} .dcard .prev .none{font-size:14px;text-align:center;padding:20px}
.dcard .body{padding:14px 16px;display:grid;gap:10px} .dcard .body h3{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px}
.ext{width:100%;border-collapse:collapse;font-size:13.5px} .ext td{padding:5px 0;border-top:1px solid var(--line-2);vertical-align:top} .ext tr:first-child td{border-top:0} .ext td:first-child{color:var(--ink-2);width:44%}
.chk{list-style:none;margin:0;padding:0;font-size:13.5px;display:grid;gap:5px} .chk li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start}
.chk li i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff} .chk li.ok i{background:var(--ok)} .chk li.bad i{background:var(--err)} .chk li.warn i{background:var(--warn)} .chk li.bad{color:var(--err)}
.conf{height:5px;border-radius:999px;background:var(--line);overflow:hidden} .conf i{display:block;height:100%;background:var(--brand-2)}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.rej{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)} .rej select,.rej textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);width:100%;font-size:14px}
.log{list-style:none;margin:0;padding:0;font-size:13.5px} .log li{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:7px 0;border-top:1px solid var(--line-2)} .log li:first-child{border-top:0} .log li span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.decision{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field.tok input{max-width:420px}
</style>
</head>
<body>
<a class="sr" href="#main">Skip to content</a>
<div class="top"><div class="in">
  <div class="brand" id="brandName"><i></i></div>
  <div class="seg" id="role" role="group" aria-label="Role"><button data-r="customer" aria-pressed="true">Πελάτης</button><button data-r="agent" aria-pressed="false">Agent</button></div>
  <div class="sp"></div>
  <div class="seg" id="langSeg" role="group" aria-label="Language"><button data-l="el" aria-pressed="true">ΕΛ</button><button data-l="en" aria-pressed="false">EN</button></div>
  <button class="btn link sm" id="exit"></button>
</div></div>

/* ═══════════════════════════ ENGINE ═══════════════════════════
   Client-side block connector. Mirrors _shared/blocks.ts:
   BLOCKS_UI[id] = { title, lead?, render(ctx), collect(root), validate(payload), submit(payload, ctx), after?(result, ctx), footer? }
   The engine renders the block the server says is active, validates on blur + on submit,
   maps server field errors back to inputs, and never disables the primary button.
   ═══════════════════════════════════════════════════════════════ */
let lang=(B.locale==="en"?"en":"el"), role="customer"; const t=k=>T[lang][k]??k;
const BASE=(location.pathname.includes("/functions/v1/")?location.origin+"/functions/v1":location.origin);
const $=(sel,root=document)=>root.querySelector(sel), $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mask=p=>p?p.replace(/\d(?=\d{3})/g,"•"):"—";
const fmtT=iso=>new Date(iso).toLocaleString(lang==="el"?"el-GR":"en-GB",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

/* api */
let agentToken=""; try{ agentToken=sessionStorage.getItem("agentToken")||""; }catch(e){}
class ApiError extends Error{ constructor(msg,status,field){ super(msg); this.status=status; this.field=field; } }
let api=async function(path,{method="GET",body,form,token}={}){
  const h={}; if(token) h.authorization="Bearer "+token; if(role==="agent"&&agentToken) h["x-agent-token"]=agentToken; if(body) h["content-type"]="application/json";
  let r; try{ r=await fetch(BASE+path,{method,headers:h,body:form?form:body?JSON.stringify(body):undefined}); }catch(e){ throw new ApiError("network",0); }
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new ApiError(j.error||r.statusText,r.status,j.field||null); return j;
}

/* announce (screen readers) + toast */
let announce=function(msg){ const el=$("#live"); el.textContent=""; setTimeout(()=>el.textContent=msg,30); }
let toast=function(msg,kind="info"){ const el=$("#toast"); el.className="toast "+kind+" show"; el.textContent=msg; clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),3200); }

/* session: only id + token + ui state in the browser */
let S=null, R=null;
function newSession(){ S={id:null,token:null,journey:null,idx:0,con:{},otp:false,otpVia:"",idMode:null,sim:{},childNote:false,lastOffers:null}; R=null; saveS(); }
function saveS(){ try{ sessionStorage.setItem("cust",JSON.stringify(S)); }catch(e){} }
async function refresh(){ if(!S.id) return; R=await api("/applications/"+S.id,{token:S.token}); }
const A=()=>R?.application||{};
const prod=id=>R?.catalogue?.products?.[id];
const pname=id=>{ const p=prod(id); return p?(lang==="el"?p.name_el:p.name_en):id; };
const pprice=id=>{ const p=prod(id); return p?`${p.price} ${p.unit}`:""; };
const pdur=id=>{ const p=prod(id); return p?.fixed_months?`${p.fixed_months} ${t("months")}`:t("nofix"); };
const docList=()=>R?.required_docs||[];
const docByType=d=>(R?.documents||[]).find(x=>x.doc_type===d);
function blocks(){ if(!R?.blocks) return []; return R.blocks.filter(b=>!b.startsWith("offers_")||(R.offers?.[b]||[]).length||S.lastOffers===b); }
function curBlock(){ const b=blocks(); return b[Math.min(S.idx,b.length-1)]; }
function idxOf(id){ return blocks().indexOf(id); }
function nextAfter(id){ const full=R?.blocks||[]; const pos=full.indexOf(id); for(const b of blocks()) if(full.indexOf(b)>pos) return b; return null; }
async function goTo(i){ S.idx=Math.max(0,Math.min(blocks().length-1,i)); saveS(); await render(); window.scrollTo({top:0,behavior:"smooth"}); }
const visibleSteps=()=>blocks().filter(b=>b!=="activation"&&!b.startsWith("offers_"));

/* ═══════════════════════════ COMPONENTS ═══════════════════════════ */
const F={
  text({id,label,value="",hint="",why="",type="text",inputmode,autocomplete,maxlength,locked=false,optional=false,placeholder=""}){
    return `<div class="field" data-field="${id}"><label for="${id}">${esc(label)}${optional?` <span class="opt">${t("v_optional")}</span>`:""}</label>
      ${why?`<p class="why" id="${id}-why">${esc(why)}</p>`:""}
      <div class="inwrap"><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${inputmode?`inputmode="${inputmode}"`:""} ${autocomplete?`autocomplete="${autocomplete}"`:""} ${maxlength?`maxlength="${maxlength}"`:""} ${locked?"disabled":""} ${placeholder?`placeholder="${esc(placeholder)}"`:""} aria-describedby="${id}-hint ${id}-err${why?" "+id+"-why":""}"><span class="ok-mark" aria-hidden="true">✓</span></div>
      ${hint?`<p class="hint" id="${id}-hint">${esc(hint)}</p>`:`<p class="hint" id="${id}-hint" hidden></p>`}<p class="err" id="${id}-err" role="alert" hidden></p></div>`;
  },
  choice({name,options,value,columns=1}){
    return `<div class="choices" data-field="${name}" role="radiogroup" style="--cols:${columns}">${options.map(o=>`<label class="choice ${value===o.value?"sel":""} ${o.disabled?"dis":""}"><input type="radio" name="${name}" value="${esc(o.value)}" ${value===o.value?"checked":""} ${o.disabled?"disabled":""}><span class="ci"></span><span class="ct"><b>${esc(o.label)}</b>${o.desc?`<span>${esc(o.desc)}</span>`:""}</span>${o.right?`<span class="cr">${o.right}</span>`:""}</label>`).join("")}<p class="err" id="${name}-err" role="alert" hidden></p></div>`;
  },
  check({id,label,checked=false,required=true}){ return `<label class="check"><input type="checkbox" id="${id}" data-con="${id}" ${checked?"checked":""}><span>${label}${required?"":` <span class="opt">${t("v_optional")}</span>`}</span></label>`; },
  alert(kind,html){ return `<div class="alert ${kind}" role="${kind==="err"?"alert":"status"}"><span class="ai"></span><div>${html}</div></div>`; },
  otp(id="otp"){ return `<div class="otp" id="${id}" role="group" aria-label="${t("otp_h")}">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${t("v_digit")} ${i+1}" autocomplete="${i===0?"one-time-code":"off"}">`).join("")}</div><p class="err" id="${id}-err" role="alert" hidden></p>`; },
  skeleton(n=3){ return `<div class="card">${Array.from({length:n},()=>`<div class="sk"></div>`).join("")}</div>`; },
};
function setErr(root,field,msg){ const wrap=$(`[data-field="${field}"]`,root); if(!wrap) return false; wrap.classList.toggle("has-err",!!msg); wrap.classList.remove("has-ok"); const e=$(".err",wrap); if(e){ e.textContent=msg||""; e.hidden=!msg; } return !!msg; }
function setOk(root,field){ const wrap=$(`[data-field="${field}"]`,root); if(wrap){ wrap.classList.remove("has-err"); wrap.classList.add("has-ok"); const e=$(".err",wrap); if(e) e.hidden=true; } }
function focusFirstError(root){ const w=$(".has-err",root); if(!w) return; const i=$("input,select,textarea",w); (i||w).focus({preventScroll:false}); w.scrollIntoView({block:"center",behavior:"smooth"}); }
const otpValue=root=>$$("#otp input",root).map(i=>i.value).join("");
function wireOtp(root){ $$("#otp input",root).forEach((el,i,a)=>{ el.addEventListener("input",()=>{ const v=el.value.replace(/\D/g,""); if(v.length>1){ v.split("").forEach((c,j)=>{ if(a[i+j]) a[i+j].value=c; }); (a[Math.min(i+v.length,5)]).focus(); return; } el.value=v; if(v&&a[i+1]) a[i+1].focus(); }); el.addEventListener("keydown",e=>{ if(e.key==="Backspace"&&!el.value&&a[i-1]) a[i-1].focus(); }); el.addEventListener("paste",e=>{ const d=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6); if(d.length===6){ e.preventDefault(); d.split("").forEach((c,j)=>a[j].value=c); a[5].focus(); } }); }); setTimeout(()=>$("#otp input",root)?.focus(),60); }

/* validators — same rules as the server, applied on blur + submit; server remains the authority */
const V={
  name:v=>v.trim()?null:"name_required",
  afm:v=>/^\d{9}$/.test(v.replace(/\s/g,""))?null:"afm_format",
  phone:v=>v.replace(/\D/g,"").length>=10?null:"phone_format",
  email:v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim())?null:"email_format",
  supply_point:v=>/^\d{9,14}$/.test(v.replace(/\s/g,""))?null:"supply_point_format",
  address:v=>v.trim().length>=5?null:"address_required",
  addressOpt:v=>(!v.trim()||v.trim().length>=5)?null:"address_required",
};
function wireBlur(root,rules){ for(const [f,rule] of Object.entries(rules)){ const i=$(`#${f}`,root); if(!i) continue; i.addEventListener("blur",()=>{ if(!i.value&&rules[f]===V.addressOpt) return setErr(root,f,null); const k=rule(i.value); k?setErr(root,f,t("e_"+k)):setOk(root,f); }); i.addEventListener("input",()=>{ if($(`[data-field="${f}"]`,root)?.classList.contains("has-err")&&!rule(i.value)) setOk(root,f); }); } }

/* ═══════════════════════════ BLOCKS (UI) ═══════════════════════════ */
const BLOCKS_UI={

          ${verifying?`<p class="muted small">${t("otp_sent")(mask(A().phone))}${S.otpVia==="server-log"?` <span class="faint">(${t("otp_log")})</span>`:""}</p>${F.otp()}<div class="row"><button class="btn primary" data-act="manverify">${t("id_m_verify")}</button><button class="btn link" data-act="mansend">${t("otp_resend")}</button></div>`:`<button class="btn primary big" data-act="mansend">${t("id_m_send")}</button>`}
        </div><p class="center"><button class="btn link" data-act="useeid">${t("id_m_back")}</button></p>`; }

    wire(root){ wireBlur(root,{name:V.name,afm:V.afm,phone:V.phone}); if($("#otp",root)) wireOtp(root); },
    hideContinue(){ const k=A().kyc; return !(k&&(k.method!=="manual"||k.phone_verified)); },
    actions:{
      gov(){ openSheet(); },
      manual(){ S.idMode="manual"; S.man={}; saveS(); render(); },
      useeid(){ S.idMode=null; S.man=null; saveS(); render(); },
      async mansend(root){ if(!(A().kyc&&A().kyc.method==="manual")){ const p={name:$("#name",root).value,afm:$("#afm",root).value,phone:$("#phone",root).value}; let bad=false; for(const [f,rule] of Object.entries({name:V.name,afm:V.afm,phone:V.phone})){ const k=rule(p[f]); if(k){ setErr(root,f,t("e_"+k)); bad=true; } } if(bad){ focusFirstError(root); return false; } S.man=p; await api("/applications/"+S.id+"/blocks/identity",{method:"POST",body:{method:"manual",...p},token:S.token}); }
        const r=await api("/otp/send",{method:"POST",body:{application_id:S.id,purpose:"identity"},token:S.token}); S.otpVia=r.delivered_via; saveS(); await refresh(); toast(t("otp_sent")(mask(A().phone))); },
      async manverify(root){ const code=otpValue(root); if(code.length!==6){ $("#otp-err",root).textContent=t("e_otp_incomplete"); $("#otp-err",root).hidden=false; $("#otp input",root).focus(); return false; }
        try{ await api("/otp/verify",{method:"POST",body:{application_id:S.id,purpose:"identity",code},token:S.token}); S.idMode=null; saveS(); await refresh(); announce(t("id_ok")); }catch(e){ $("#otp-err",root).textContent=t("e_otp_wrong")+(e.status===429?" "+t("e_otp_lock"):""); $("#otp-err",root).hidden=false; $$("#otp input",root).forEach(i=>i.value=""); $("#otp input",root).focus(); return false; } }
    }
  },

        ${(fb||opt)?F.text({id:"address",label:t("ad_l"),value:a.address||"",autocomplete:"street-address",hint:opt?t("ad_opt_h"):t("ad_h"),optional:opt,locked:done})+(done&&a.address?F.alert(a.fiber_serviceable?"ok":"warn",a.fiber_serviceable?t("ad_ok"):t("ad_bad")):""):""}</div>`; },

let busy=false;
async function run(fn){ if(busy) return; busy=true; document.body.classList.add("busy"); let keep=false; try{ keep=(await fn())===false; }catch(e){ if(e instanceof ApiError&&e.status===0) toast(t("e_network"),"err"); else if(e instanceof ApiError&&e.status===404&&S.id){ newSession(); toast(t("e_session"),"err"); } else toast(t("e_"+e.message)!=="e_"+e.message?t("e_"+e.message):e.message,"err"); } busy=false; document.body.classList.remove("busy"); if(!keep) await render(); }

/* primary action: validate → submit → advance */
async function onContinue(root){ const id=curBlock(); const b=BLOCKS_UI[id]; if(!b) return;
  if(b.refreshBefore&&S.id){ try{ await refresh(); }catch(e){} }
  const payload=b.collect?b.collect(root):{}; const errs=b.validate?b.validate(payload):{}; let any=false; for(const [f,k] of Object.entries(errs)){ if(setErr(root,f,t("e_"+k))) any=true; else { const e=$(`#${f}-err`,root); if(e){ e.textContent=t("e_"+k); e.hidden=false; any=true; } } }
  if(any){ focusFirstError(root); announce(t("e_fix")); return; }
  await run(async()=>{ if(b.submit&&!(b.skipSubmit&&b.skipSubmit())){ try{ await b.submit(payload); }catch(e){ if(e instanceof ApiError&&e.field&&setErr(root,e.field,t("e_"+e.message)!=="e_"+e.message?t("e_"+e.message):e.message)){ focusFirstError(root); return false; } throw e; } }
    if(S.id){ await refresh(); if(id==="activation"||id==="offers_3") return; const nx=nextAfter(id); S.lastOffers=null; await goTo(nx?idxOf(nx):S.idx+1); } });
}

  return `<div class="dcard ${x.status}">${prev}<div class="body">
    <h3>${t("d_"+d)}<span class="pill ${x.status}">${t("st_"+x.status)}</span></h3>
    <p class="faint small">${t("a_uploaded")} ${fmtT(x.uploaded_at)} · ${esc(x.file_name)} · ${Math.round(x.bytes/1024)} KB · sha256 ${x.sha256.slice(0,12)}…</p>
    ${ex?`<div><p class="faint small" style="margin-bottom:4px">${t("a_extract")} <span class="mono">${esc(ex.model)}</span>${ex.model.startsWith("stub")?` — <span style="color:var(--warn)">no extraction key set</span>`:""}</p><table class="ext">${Object.entries(ex.fields).map(([k,v])=>`<tr><td>${esc(k)}</td><td><b>${esc(v.value??"—")}</b> <span class="faint small">${Math.round((v.confidence||0)*100)}%</span></td></tr>`).join("")}</table></div>
    <div><p class="faint small" style="margin-bottom:4px">${t("a_checks")} → <b>${esc(ex.recommendation)}</b></p><ul class="chk">${ex.checks.map(c=>`<li class="${c.ok===null?"warn":c.ok?"ok":"bad"}"><i>${c.ok===null?"?":c.ok?"✓":"✕"}</i><span>${esc(c.key)}${c.expected!=null||c.found!=null?`<span class="faint small"> · ${esc(c.found??"—")} vs ${esc(c.expected??"—")}</span>`:""}${c.note?`<span class="faint small"> · ${esc(c.note)}</span>`:""}</span></li>`).join("")}</ul></div>
    <div><p class="faint small" style="margin-bottom:4px">${t("a_conf")} ${Math.round(ex.confidence*100)}% · ${ex.latency_ms} ms</p><div class="conf"><i style="width:${ex.confidence*100}%"></i></div></div>`:""}
    ${x.status==="rejected"?`<p class="small" style="color:var(--err)">${t("r_"+x.reject_reason)}${x.reject_note?" — "+esc(x.reject_note):""}</p>`:""}
    ${x.status==="pending"?(rejOpen===x.id?`<div class="rej"><b class="small">${t("a_reject_h")}</b><select id="rr">${["illegible","wrong_document","name_mismatch","expired","other"].map(r=>`<option value="${r}">${t("r_"+r)}</option>`).join("")}</select><textarea id="rn" rows="2" placeholder="${t("a_note")}"></textarea><div class="dact"><button class="btn sm danger" data-ag="rejectSend" data-id="${x.id}">${t("a_reject_send")}</button><button class="btn sm link" data-ag="rejectCancel">${t("a_cancel")}</button></div></div>`:`<div class="dact"><button class="btn sm ok" data-ag="approve" data-id="${x.id}">${t("a_approve")}</button><button class="btn sm danger" data-ag="reject" data-id="${x.id}">${t("a_reject")}</button></div>`):""}
  </div></div>`; }
const AG={
  approve(el){ api("/review",{method:"POST",body:{application_id:selApp,document_id:el.dataset.id,action:"approve"}}).then(render).catch(e=>alert(e.message)); },
  reject(el){ rejOpen=el.dataset.id; render(); }, rejectCancel(){ rejOpen=null; render(); },
  rejectSend(el){ api("/review",{method:"POST",body:{application_id:selApp,document_id:el.dataset.id,action:"reject",reason:document.getElementById("rr").value,note:document.getElementById("rn").value.trim()}}).then(()=>{ rejOpen=null; render(); }).catch(e=>alert(e.message)); },
  activate(){ api("/review",{method:"POST",body:{application_id:selApp,action:"activate"}}).then(render).catch(e=>alert(e.message)); }
};



/* ═══════════════════════════ SHELL ═══════════════════════════ */
async function render(){
  document.documentElement.lang=lang; document.title=B.name+" · e-Contract";
  const bn=$("#brandName"); bn.innerHTML=`<i></i>${esc(B.name)}`;
  const ex=$("#exit"); ex.textContent=role==="customer"?t("newApp"):t("exit");
  if(role==="customer"){ if(!S){ try{ S=JSON.parse(sessionStorage.getItem("cust"))||null; }catch(e){} if(!S) newSession(); } await renderCustomer(); } else await renderAgent();
}
$$("#role button").forEach(b=>b.onclick=()=>{ role=b.dataset.r; $$("#role button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); rejOpen=null; render(); window.scrollTo({top:0}); });
$$("#langSeg button").forEach(b=>b.onclick=()=>{ lang=b.dataset.l; $$("#langSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); render(); });
$("#exit").onclick=()=>{ if(role==="customer"){ if(S.id&&!A().signed_at&&!confirm(t("confirm_new"))) return; newSession(); render(); } else { agentToken=""; try{ sessionStorage.removeItem("agentToken"); }catch(e){} render(); } };
$("#lightbox").onclick=e=>e.currentTarget.classList.remove("open");
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ $("#sheetBg").classList.remove("open"); $("#lightbox").classList.remove("open"); } });
render();

</script>
